<script>
'use strict';
(() => {

const storage=(()=>{const fallback=new Map();try{const k='briarford_storage_test';window.localStorage.setItem(k,'ok');window.localStorage.removeItem(k);return window.localStorage;}catch(e){return {getItem:k=>fallback.has(k)?fallback.get(k):null,setItem:(k,v)=>fallback.set(k,String(v)),removeItem:k=>fallback.delete(k)};}})();
const $=id=>document.getElementById(id);
const cn=$('game'),ctx=cn.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const STATS=['STR','DEX','CON','INT','WIS','CHA'];

const COLOURS={Sania:['#30212a','#a78b6d','#56866d'],Liora:['#b9793f','#e4af86','#a8b1db'],Renn:['#694733','#c49a77','#7d9a61'],Teren:['#733b2e','#c59b7b','#d58c61'],Garrick:['#382a27','#c99e7d','#847c6f'],Mira:['#514443','#e3b28c','#7493ae'],Haldric:['#aab0a5','#d2a47b','#bc9972'],Orven:['#2e3536','#ba967c','#647e89'],Vessa:['#8f5429','#d9ac85','#b78d58'],Elna:['#97958e','#c99f82','#927d9f']};
let state=null, mapCache={}, moveTimer=null, pending=null, frame=0, lastNpcTick=0;
const npcsDefault=[
 {id:'Liora',name:'Liora',x:40,y:13,work:[40,13],home:[42,10],traits:{kind:83,brave:62,greedy:12},job:'Ūkininkų dukra',desc:'Smalsi vaikystės draugė, turinti stiprų magijos potencialą.',relationship:76,memory:[]},
 {id:'Renn',name:'Renn',x:17,y:27,work:[16,27],home:[16,29],traits:{kind:65,brave:78,greedy:24},job:'Medžiotojo mokinys',desc:'Geriausias draugas. Jo nuotykiai paprastai baigiasi problemomis.',relationship:88,memory:[]},
 {id:'Teren',name:'Teren',x:36,y:20,work:[38,20],home:[36,11],traits:{kind:33,brave:69,greedy:56},job:'Kalvio mokinys',desc:'Ambicingas konkurentas. Nori patekti tarp Magijos riterių.',relationship:27,memory:[]},
 {id:'Garrick',name:'Garrick',x:38,y:20,work:[39,20],home:[36,26],traits:{kind:40,brave:57,greedy:31},job:'Kalvis',desc:'Geras amatininkas, susirūpinęs geležies tiekimu.',relationship:45,memory:[]},
 {id:'Mira',name:'Mira',x:24,y:19,work:[24,19],home:[30,26],traits:{kind:76,brave:51,greedy:18},job:'Gydytoja',desc:'Vandens magė. Gydo kaimo gyventojus ir keliautojus.',relationship:55,memory:[]},
 {id:'Haldric',name:'Haldric',x:29,y:19,work:[29,19],home:[30,28],traits:{kind:30,brave:42,greedy:81},job:'Seniūnas',desc:'Domisi mokesčiais, prekyba ir kaimo įtaka.',relationship:40,memory:[]},
 {id:'Orven',name:'Orven',x:28,y:23,work:[28,23],home:[30,29],traits:{kind:37,brave:85,greedy:19},job:'Sargybos vadas',desc:'Visada stebi, kas vyksta aikštėje.',relationship:47,memory:[]},
 {id:'Vessa',name:'Vessa',x:17,y:21,work:[17,21],home:[22,13],traits:{kind:54,brave:72,greedy:68},job:'Pirklė',desc:'Atkeliauja su prekėmis ir gandais.',relationship:44,memory:[]},
 {id:'Elna',name:'Elna',x:22,y:27,work:[22,27],home:[21,28],traits:{kind:91,brave:50,greedy:10},job:'Buvusi globėja',desc:'Dažnai padeda skurstantiems vaikams, nors Sania augo savarankiškai.',relationship:61,memory:[]}
];
function newState(){let npcs=structuredClone(npcsDefault);for(const n of npcs){const b={STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10};if(n.job.includes('Kalv'))b.STR=14;if(n.job.includes('Medžiotojo'))b.DEX=14;if(n.job.includes('Gydytoja')){b.INT=14;b.WIS=14}if(n.job.includes('Seniūnas')||n.job.includes('Pirklė'))b.CHA=14;if(n.id==='Liora')b.INT=13;if(n.id==='Orven'){b.CON=14;b.STR=13}n.stats=b;n.skills={craft:n.id==='Garrick'?6:0,combat:n.id==='Orven'?7:2,magic:n.id==='Mira'?7:1};}return {version:1,zone:'village',x:45,y:34,minute:420,day:1,hp:30,maxHp:30,level:1,xp:0,gold:12,stats:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},skills:{blade:0,archery:0,survival:0,craft:0,social:0,magic:0},items:{bread:2,potion:1,book:1},npcs:npcs,quests:{},flags:{},seen:['village'],grimoire:'sealed',powers:{antiMagic:'dormant',secondPower:'dormant'},log:['Rytas po grimoarų ceremonijos. Tavo grimoaras vis dar užantspauduotas.'],enemy:{wolfAlive:true},created:false,seed:72121};}
function rand(a=0,b=1){state.seed=(Math.imul(1664525,state.seed)+1013904223)>>>0;return a+state.seed/4294967296*(b-a)}
function d20(){return 1+Math.floor(rand(0,20))}function check(stat,difficulty,extra=0){let roll=d20();return {roll,total:roll+Math.floor((state.stats[stat]-10)/2)+extra,pass:roll+Math.floor((state.stats[stat]-10)/2)+extra>=difficulty}}
function addItem(id,qty=1){state.items[id]=(state.items[id]||0)+qty; if(state.items[id]<=0)delete state.items[id]}
function skillUp(id,amt=1){state.skills[id]+=amt;if(state.skills[id]>=5 && state.skills[id]-amt<5)notify('Tavo įgūdis „'+skillNames[id]+'“ pastebimai pagerėjo.')}
function gainXP(n){state.xp+=n;let limit=25*state.level;while(state.xp>=limit){state.xp-=limit;state.level++;state.maxHp+=4;state.hp=Math.min(state.maxHp,state.hp+8);state.stats.CON+=1;notify('Pasiektas '+state.level+' lygis! +4 max HP, +1 CON.');limit=25*state.level}}
function remember(id,text,change=0){const n=state.npcs.find(x=>x.id===id);if(!n)return;n.memory.unshift({day:state.day,text});n.memory=n.memory.slice(0,8);n.relationship=Math.max(0,Math.min(100,n.relationship+change))}
function notify(t){state.log.unshift(t);state.log=state.log.slice(0,30);$('event').textContent=t;updateHUD()}
function updTime(delta){state.minute+=delta;while(state.minute>=1440){state.minute-=1440;state.day++;if(state.day>1)state.flags.hasAged=true;villageDay();}if(state.minute<0)state.minute=0; if(state.zone==='village' && Math.floor(state.minute/3)!==lastNpcTick){lastNpcTick=Math.floor(state.minute/3);moveNPCs()}}
function time(){const n=Math.floor(state.minute),h=Math.floor(n/60)%24,m=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function updateHUD(){if(!state)return;$('day').textContent=state.day+' diena · '+time();$('hp').textContent=state.hp+'/'+state.maxHp;$('hpfill').style.width=Math.max(0,state.hp/state.maxHp*100)+'%';$('level').textContent='Lv. '+state.level;$('gold').textContent='🪙 '+state.gold;$('scene').textContent=indoors()?(HOUSE_DEFS.find(h=>h.id===interiorId())?.name||'Pastato vidus'):state.zone==='village'?'Briarford · Clover Kingdom':'Briarford miškas · Clover Kingdom';$('worldtag').textContent=indoors()?'Viduje':state.zone==='village'?'Briarford':'Šiaurinis miškas';$('tip').textContent=state.combat?'Kovoje bakstelėk langelį judėjimui':'Bakstelėk taką arba veikėją';$('battlebar').style.display=state.combat?'grid':'none';$('actions').style.display=state.combat?'none':'grid';if(state.combat){$('combattitle').textContent='🐺 Vilkas '+state.combat.hp+' HP · AP '+state.combat.ap+'/4 · bonus '+state.combat.bonus;$('attackBtn').disabled=state.combat.ap<2;$('guardBtn').disabled=state.combat.ap<1;$('focusBtn').disabled=state.combat.bonus<1;$('healBtn').disabled=!state.items.potion||state.combat.bonus<1;$('fleeBtn').disabled=state.combat.ap<2;}}
function hash(x,y,seed=39){let a=Math.imul(x+seed,374761393)+Math.imul(y+7,668265263);a=Math.imul(a^(a>>>13),1274126177);return (a^(a>>>16))>>>0}
function makeMap(which){if(which.startsWith('inside:'))return insideMap(which);if(mapCache[which])return mapCache[which];let m=[];for(let y=0;y<H;y++){let line=[];for(let x=0;x<W;x++){let h=hash(x,y);let ty='grass';if(which==='village'){
 if(x<=1||x>=50||y<=1||y>=36)ty='trees';
 if(h%20===0 && y<13 && x<20)ty='trees';
 const river=7+Math.round(Math.sin(y*.30)*1.2);
 if(Math.abs(x-river)<=1)ty='water';
 if(y===19&&x>=river-3&&x<=51)ty='road';
 if(x===26&&y>=5&&y<=35)ty='road';
 if(y>=15&&y<=24&&x>=21&&x<=32)ty='square';
 if(x>=16&&x<=44&&y===19)ty='road';
 if(y===32&&x>=26&&x<=45)ty='road';
 if(x===45&&y>=32&&y<=35)ty='road';
 if(x>=38&&x<=44&&y===12)ty='road';
 if(x===41&&y>=12&&y<=19)ty='road';
 if(x>=14&&x<=17&&y===27)ty='road';
 if(x===17&&y>=19&&y<=29)ty='road';
 if(x>=17&&x<=26&&y===26)ty='road';
 if(x>=28&&x<=30&&y>=24&&y<=32)ty='road';
 if(x>=11&&x<=18&&y>=30&&y<=34&&hash(x,y)%3)ty='farm';
 const houses=[{x:43,y:28,w:6,h:5,door:46},{x:22,y:10,w:7,h:5,door:25},{x:35,y:13,w:7,h:6,door:38},{x:37,y:7,w:8,h:5,door:41},{x:11,y:21,w:6,h:5,door:14},{x:19,y:27,w:5,h:5,door:21},{x:27,y:26,w:6,h:5,door:29}];
 for(const b of houses){if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){ty=(y===b.y+b.h-1&&x===b.door)?'door':'house'}}
 if((x===26&&y===21)||(x===18&&y===20))ty='well';
 if(x===7&&y===19)ty='bridge';
 }else{
 if(x<=1||x>=50||y<=1||y>=36)ty='trees';
 if(h%100<27)ty='trees';
 if(h%100>=27&&h%100<34)ty='brush';
 if(x>=3&&x<=27&&y>=16&&y<=30&&hash(x,y)%4!==0)ty='grass';
 if(x>=3&&x<=16&&y===27)ty='road';
 if(x===6&&y>=24&&y<=30)ty='road';
 if(x>=17&&x<=24&&y>=14&&y<=20&&hash(x,y)%7!==0)ty='grass';
 }
 line.push(ty);}m.push(line)}mapCache[which]=m;return m}
function walkable(x,y,zone=state.zone){if(x<0||y<0||x>=W||y>=H)return false;const t=makeMap(zone)[y][x];return !['trees','water','house','well','wall','void','furniture'].includes(t)}
function pathTo(sx,sy,tx,ty,adjacent=false,zone=state.zone){const dirs=[[1,0],[-1,0],[0,1],[0,-1]],queue=[[sx,sy]],prev=new Map([[sx+','+sy,null]]);let target=null;for(let i=0;i<queue.length;i++){let [x,y]=queue[i];if((adjacent?Math.abs(x-tx)+Math.abs(y-ty)<=1:x===tx&&y===ty)){target=[x,y];break}for(const [dx,dy] of dirs){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(!prev.has(k)&&walkable(nx,ny,zone)){prev.set(k,[x,y]);queue.push([nx,ny])}}}if(!target)return null;const out=[];let p=target;while(p&&(p[0]!==sx||p[1]!==sy)){out.unshift(p);p=prev.get(p.join(','))}return out}
function stopMoving(){if(moveTimer){clearInterval(moveTimer);moveTimer=null}pending=null}
function startMove(path,callback){stopMoving();if(!path){notify('Ten patekti negali. Pasirink kitą vietą.');return}if(!path.length){if(callback)callback();return}let index=0;moveTimer=setInterval(()=>{if(!state||state.combat){stopMoving();return}if(index>=path.length){stopMoving();if(callback)callback();return}const [x,y]=path[index++];state.x=x;state.y=y;updTime(.2);draw();updateHUD();if(index>=path.length){stopMoving();if(callback)callback();}},78)}
function moveNPCs(){if(!state||state.zone!=='village')return;const hour=state.minute/60;for(const n of state.npcs){let dest=hour<7||hour>=21?n.home:hour<9?[n.work[0]+(n.id==='Renn'?-2:0),n.work[1]]:hour<18?n.work:hour<20?[25,21]:n.home; if(!walkable(dest[0],dest[1]))dest=n.work;let p=pathTo(n.x,n.y,dest[0],dest[1],false,'village');if(p&&p.length){let [x,y]=p[0];if(x!==state.x||y!==state.y){n.x=x;n.y=y}}}}
function drawTile(tile,x,y,gx,gy){if(['floor','wall','furniture','exit','void'].includes(tile)){ctx.fillStyle=tile==='void'?'#121b1a':tile==='wall'?'#514c40':tile==='furniture'?'#775a3e':tile==='exit'?'#977045':((gx+gy)%2?'#796b53':'#86765e');ctx.fillRect(x,y,16,16);if(tile==='furniture'){ctx.fillStyle='#ad8861';ctx.fillRect(x+3,y+3,10,9);ctx.fillStyle='#483c2d';ctx.fillRect(x+5,y+11,6,3)}if(tile==='exit'){ctx.fillStyle='#412d24';ctx.fillRect(x+3,y+1,10,15);ctx.fillStyle='#d8bd77';ctx.fillRect(x+10,y+8,2,2)}return}let c1='#354e39',c2='#3e5940';ctx.fillStyle=(hash(gx,gy)&1)?c1:c2;ctx.fillRect(x,y,TILE,TILE);const h=hash(gx,gy);

function onTap(ev){if(!state||!state.created||$('overlay').classList.contains('visible'))return;ev.preventDefault();const [tx,ty]=toTile(ev);if(state.combat){if(!walkable(tx,ty)){notify('Ten negali pajudėti.');return}let path=pathTo(state.x,state.y,tx,ty);if(!path||!path.length)return;let cost=path.length;if(cost>state.combat.ap){notify('Trūksta AP. Judėjimas kainuoja po 1 AP už langelį.');return}if(tx===state.combat.enemyX&&ty===state.combat.enemyY){notify('Negali stoti į priešo vietą.');return}state.x=tx;state.y=ty;state.combat.ap-=cost;notify('Pajudėjai '+cost+' langelius.');draw();updateHUD();return}
 if(state.zone==='village'){
  const npc=state.npcs.find(n=>n.x===tx&&n.y===ty);if(npc){startMove(pathTo(state.x,state.y,tx,ty,true),()=>talk(npc.id));return}
  const obj=makeMap('village')[ty]?.[tx];if(obj==='door'){const own=tx===46&&ty===32;startMove(pathTo(state.x,state.y,tx,ty,true),()=>interact(own?'home':'door'));return}

 }else if(state.enemy.wolfAlive&&tx===20&&ty===17){startMove(pathTo(state.x,state.y,tx,ty,true),()=>beginCombat());return}

function activityPanel(){ensureV02();if(indoors()){indoorObject(25,20);return;}const zone=state.zone;let choices=[];if(zone==='village'){choices=[{text:'📋 Patikrinti skelbimų lentą (aikštėje)',act:()=>goLandmark('board')},{text:'🥊 Treniruotis aikštelėje',act:()=>goLandmark('training')},{text:'🎣 Žvejoti upėje',act:()=>goLandmark('fishing')},{text:'🌾 Padėti ūkininkams',act:()=>goLandmark('farmwork')},{text:'🛠️ Dirbti / gaminti',act:craftMenu},{text:'📖 Studijuoti grimoarą',act:grimoire}];}else{choices=[{text:'🌿 Rinkti vaistažoles',act:()=>goLandmark('herbs')},{text:'⛏️ Ieškoti geležies',act:()=>goLandmark('quarry')},{text:'🐾 Sekti žvėris',act:()=>goLandmark('tracks')},{text:'🪵 Surinkti malkas',act:()=>gather('wood')},{text:'🏕️ Pailsėti trumpai',act:()=>{state.hp=Math.min(state.maxHp,state.hp+3);updTime(45);notify('Trumpai atsikvėpei. +3 HP.')}}];}modal('Veiklos · '+(zone==='village'?'Briarford':'Miškas'),'Darbai ir vietos reaguoja į laiką, daiktus ir tavo įgūdžius. Galima bakstelėti ir ant žemėlapio pažymėtų ženklų.',choices)}
function goLandmark(id){let p=LANDMARKS.find(v=>v.id===id);if(!p||state.zone!==p.zone){notify('Ši vieta kitame regione.');return}const path=pathTo(state.x,state.y,p.x,p.y,true);startMove(path,()=>landmarkAction(id))}
function landmarkAction(id){ensureV02();const p=LANDMARKS.find(z=>z.id===id);if(!p)return;const menu={board:[{text:'📌 Peržiūrėti kaimo darbus',act:jobBoard},{text:'🪵 Pasiūlyti medienos tiltui',act:()=>{if((state.items.wood||0)<3){notify('Tilto remontui reikia 3 malkų.');return}addItem('wood',-3);state.flags.villageStatus.bridge=Math.min(100,state.flags.villageStatus.bridge+8);state.gold+=6;gainXP(5);updTime(20);notify('Padėjai remontuoti tiltą. +6 monetos, +5 XP.')}}],training:[{text:'⚔️ Treniruoti kardo valdymą',act:()=>practice('blade')},{text:'🏹 Treniruoti vikrumą',act:()=>practice('archery')},{text:'💪 Lavinti jėgą',act:()=>practice('strength')}],fishing:[{text:'🎣 Žvejoti (20 min.)',act:()=>{const c=check('WIS',10,state.skills.survival);updTime(20);skillUp('survival',1);if(c.pass){addItem('fish');notify('Pagavai žuvį! +1 žuvis.')}else notify('Žuvis nuplaukė – šįkart nepasisekė.')}},{text:'💧 Pasisemti vandens',act:()=>{addItem('water');updTime(4);notify('Pasisėmei vandens.')}}],farmwork:[{text:'🌾 Padirbėti už atlyginimą',act:()=>labor('farm')},{text:'🍓 Rinkti uogas',act:()=>gather('berry')}],herbs:[{text:'🌿 Rinkti vaistažoles',act:()=>gather('herbs')},{text:'🍓 Ieškoti uogų',act:()=>gather('berry')}],quarry:[{text:'⛏️ Rinkti geležingą rūdą',act:()=>gather('ore')}],tracks:[{text:'🐾 Tyrinėti pėdsakus',act:()=>{updTime(18);const c=check('WIS',11,state.skills.survival);skillUp('survival',1);if(c.pass){state.flags.tracksFound=state.day;notify('Atpažinai pėdsakus. Sargybai tai gali būti naudinga.')}else notify('Pėdsakai susiliejo su senesniais, bet išmokai daugiau apie mišką.')}},{text:'🪵 Rinkti malkas',act:()=>gather('wood')}]}[id]||[];modal(p.name,p.desc,menu)}
function dailyCap(id,max=3){ensureV02();let key=state.day+':'+id;let k=state.flags.dailyActions;let n=k[key]||0;if(n>=max){notify('Ši vieta šiandien išnaudota. Rytoj atsiras naujų galimybių.');return false}k[key]=n+1;return true}
function gather(id){if(!dailyCap('gather-'+id,4))return;const d=id==='ore'?22:id==='herbs'?14:12;updTime(d);const stat=id==='ore'?'STR':'WIS',difficulty=id==='ore'?13:10;let c=check(stat,difficulty,state.skills.survival);skillUp('survival',1);if(c.pass){let qty=id==='wood'?2:1;addItem(id,qty);notify('Surinkai '+qty+' × '+itemNames[id]+'.')}else notify('Ieškojai, bet šįkart nieko naudingo neradai.');draw()}
function labor(where){if(!dailyCap('labor-'+where,2))return;const skill=where==='forge'?'craft':'survival';const c=check(where==='forge'?'STR':'CON',10,state.skills[skill]);updTime(55);skillUp(skill,1);let pay=c.pass?8:4;state.gold+=pay;gainXP(4);notify('Padirbėjai '+(where==='forge'?'kalvėje':'ūkyje')+'. +'+pay+' monetos, +4 XP.');}
function practice(skill){if(!dailyCap('practice-'+skill,3))return;updTime(25);if(skill==='strength'){const r=check('CON',11);if(r.pass){state.flags.strengthSessions=(state.flags.strengthSessions||0)+1;if(state.flags.strengthSessions%5===0){state.stats.STR++;notify('Po daugybės treniruočių sustiprėjai. STR +1.');return;}}notify('Atlikai jėgos treniruotę.');return;}skillUp(skill,2);gainXP(2);notify('Treniravaisi. '+(skillNames[skill]||skill)+' +2, XP +2.');}
function craftMenu(){ensureV02();const recipes=[{name:'Deglas',id:'torch',need:{wood:1},time:12},{name:'Gydomasis užpilas',id:'potion',need:{herbs:2,water:1},time:25},{name:'Tvarstis',id:'bandage',need:{herbs:1},time:15}];modal('Paprasti amatai','Naudok surinktas medžiagas. Nesėkmingas bandymas eikvoja laiką, bet ne visas medžiagas.',recipes.map(r=>({text:'🛠️ '+r.name+' ('+Object.entries(r.need).map(([id,n])=>n+' × '+(itemNames[id]||id)).join(', ')+')',act:()=>{if(Object.entries(r.need).some(([id,n])=>(state.items[id]||0)<n)){notify('Neturi reikalingų medžiagų.');return}updTime(r.time);const c=check('INT',10,state.skills.craft);skillUp('craft',1);if(c.pass){Object.entries(r.need).forEach(([id,n])=>addItem(id,-n));addItem(r.id);gainXP(3);notify('Pagaminai: '+r.name+'. +3 XP.')}else notify('Bandymas nepavyko. Medžiagas išsaugojai, tačiau praradai laiko.')}})))}
function jobBoard(){ensureV02();const tasks=[['herbal','Miros vaistažolės','Mira prašo atnešti 3 vaistažoles.'],['firewood','Elnos malkos','Elna prašo 2 malkų savo židiniui.'],['bridge','Tilto remontas','Kaimo tiltui prireiks 3 malkų.'],['tracks','Įtartini pėdsakai','Orven prašo ištirti miško taką.'],['parcel','Pirklės siuntinys','Vessa nori perduoti siuntinį Elnai.']];modal('Kaimo skelbimų lenta','Darbai nėra privalomi. Atlygis ir žmonių reakcijos priklauso nuo to, ką atliksi.',tasks.map(([id,title,desc])=>({text:(state.quests[id]?.status==='done'?'✅ ':state.quests[id]?'📌 ':'＋ ')+title,act:()=>{if(state.quests[id]){notify(desc);return}state.quests[id]={title,desc,status:'active'};notify('Užsirašei darbą: '+title)}})))}
function questAction(id){ensureV02();if(id==='Mira'){const q=state.quests.herbal;if(!q){state.quests.herbal={title:'Miros vaistažolės',desc:'Surink 3 vaistažoles ir grąžink Mirai.',status:'active'};notify('Mira paprašė trijų vaistažolių.');return}if(q.status==='active'&&(state.items.herbs||0)>=3){addItem('herbs',-3);state.gold+=11;addItem('potion');q.status='done';remember('Mira','atnešei tris vaistažoles',7);gainXP(12);notify('Mira padėkojo. +11 monetų, užpilas ir +12 XP.')}else notify(q.status==='done'?'Mira dėkoja už pagalbą.':'Mira laukia 3 vaistažolių.');return}
 if(id==='Elna'){const q=state.quests.firewood;if(!q){state.quests.firewood={title:'Elnos malkos',desc:'Parnešk 2 malkas.',status:'active'};notify('Elna paprašė dviejų malkų.');return}if(q.status==='active'&&(state.items.wood||0)>=2){addItem('wood',-2);state.gold+=5;addItem('bread');q.status='done';remember('Elna','atnešei malkų',7);gainXP(7);notify('Elna dėkoja. +5 monetos, duona ir +7 XP.')}else notify(q.status==='done'?'Elna šypsosi prisiminusi tavo pagalbą.':'Elna laukia 2 malkų.');return}
 if(id==='Orven'){const q=state.quests.tracks;if(!q){state.quests.tracks={title:'Įtartini pėdsakai',desc:'Ištirk medžiotojų taką šiauriniame miške.',status:'active'};notify('Orven paprašė apžiūrėti miško taką.');return}if(q.status==='active'&&state.flags.tracksFound){q.status='done';state.gold+=9;gainXP(12);remember('Orven','pranešei apie miško pėdsakus',7);notify('Orven patikėjo tavo ataskaita. +9 monetos, +12 XP.')}else notify(q.status==='done'?'Orven vertina tavo pastabumą.':'Orven dar laukia ataskaitos apie taką.');return}
 if(id==='Vessa'){if(!state.quests.parcel){state.quests.parcel={title:'Pirklės siuntinys',desc:'Perduok Elnai siuntinį iš Vessa.',status:'active'};addItem('parcel');notify('Vessa įteikė tau sandarų siuntinį Elnai.');return}notify('Vessa laukia, kol siuntinys bus pristatytas.');return}
 if(id==='Haldric'){let q=state.quests.bridge;if(!q){state.quests.bridge={title:'Tilto remontas',desc:'Pristatyk 3 malkas tilto remontui.',status:'active'};notify('Haldric paprašė padėti tiltui.');return}if(q.status==='active'&&(state.items.wood||0)>=3){addItem('wood',-3);q.status='done';state.gold+=11;gainXP(11);state.flags.villageStatus.bridge=Math.min(100,state.flags.villageStatus.bridge+15);remember('Haldric','prisidėjai prie tilto remonto',5);notify('Tilto remontas pasistūmėjo. +11 monetų ir +11 XP.')}else notify('Tilto remontui dar reikia trijų malkų.');return}
 if(id==='Renn'){let q=state.quests.hunt;if(!q){state.quests.hunt={title:'Miško grobis',desc:'Renn laukia mėsos ir kailio.',status:'active'};notify('Renn paprašė medžioklės grobio.');return}if(q.status==='active'&&state.items.meat&&state.items.hide){addItem('meat',-1);addItem('hide',-1);state.gold+=13;q.status='done';gainXP(18);remember('Renn','padėjai medžioklėje',8);notify('Renn sumokėjo 13 monetų ir padėkojo. +18 XP.')}else notify('Renn dar laukia grobio.');return}
 if(id==='Garrick'){let q=state.quests.ore;if(!q){state.quests.ore={title:'Kalvio užsakymas',desc:'Atnešk 2 geležies gabalus.',status:'active'};notify('Garrick reikia 2 geležies gabalų.');return}if(q.status==='active'&&(state.items.ore||0)>=2){addItem('ore',-2);state.gold+=15;q.status='done';gainXP(16);skillUp('craft',2);remember('Garrick','atnešei geležies',9);notify('Garrick sumokėjo 15 monetų. +16 XP.')}else notify('Garrick dar laukia geležies.');return}}
function npcMessage(id,topic){let n=state.npcs.find(p=>p.id===id);let lines=npcLines[id]?.[topic]||['Šiandien kaime viskas gana ramu.'];let k=id+':'+topic,idx=state.flags.talkCycles[k]||0;state.flags.talkCycles[k]=idx+1;let greeting=state.minute<720?'Labas rytas. ':state.minute<1080?'Laba diena. ':'Labas vakaras. ';let relation=n.relationship<30?'Nesitikėk, kad tau viską papasakosiu. ':n.relationship>70?'Tau galiu pasakyti. ':'';return greeting+relation+lines[(idx+state.day-1)%lines.length]}
function replyTo(id,topic,delta=0){const n=state.npcs.find(z=>z.id===id);updTime(5);remember(id,topic==='personal'?'pasidalinote prisiminimais':'aptarėte '+topic,delta);const line=npcMessage(id,topic);modal(n.name,line,[{text:'💬 Kalbėti toliau',act:()=>talk(id)},{text:'Atsisveikinti'}])}
function talk(id){ensureV02();const n=state.npcs.find(z=>z.id===id);if(!n)return;let choices=[{text:'☀️ Paklausti, kaip šiandien sekasi',act:()=>replyTo(id,'day',1)},{text:'⚒️ Pasiteirauti apie jo / jos darbą',act:()=>replyTo(id,'job',0)},{text:'🧡 Kalbėtis apie praeitį',act:()=>replyTo(id,'personal',n.relationship>35?1:0)},{text:'🗣️ Paklausti vietinių naujienų',act:()=>{updTime(4);rumor(id)}},{text:'📋 Pasiteirauti, ar reikia pagalbos',act:()=>{questAction(id);talk(id)}}];if(id==='Vessa')choices.push({text:'🪙 Prekiauti',act:shop});if(id==='Mira')choices.push({text:'💧 Paprašyti gydymo (5 🪙)',act:()=>{if(state.gold<5){notify('Trūksta monetų.');return}state.gold-=5;state.hp=Math.min(state.maxHp,state.hp+14);updTime(12);remember(id,'kreipeisi dėl gydymo',1);notify('Mira tave išgydė. +14 HP.')}});if(id==='Teren')choices.push({text:'💪 Varžytis jėga',act:()=>{updTime(10);let test=check('STR',13);if(test.pass){remember(id,'pralaimėjo jėgos varžybas',-2);gainXP(4);notify('Laimėjai prieš Teren! +4 XP.')}else{remember(id,'laimėjo jėgos varžybas',1);notify('Teren triumfuoja laimėjęs.')}}});if(id==='Liora')choices.push({text:'✨ Kartu tyrinėti grimoarą',act:()=>{updTime(25);remember(id,'kartu tyrinėjote grimoarą',2);skillUp('magic',2);notify('Liora padėjo nagrinėti magiją. Magijos teorija +2.')}});if(id==='Renn')choices.push({text:'🏹 Pasimokyti sekimo',act:()=>practice('survival')});if(id==='Garrick')choices.push({text:'🔨 Padirbėti kalvėje',act:()=>labor('forge')});if(id==='Orven')choices.push({text:'🛡️ Pasitreniruoti gynybą',act:()=>practice('blade')});if(id==='Haldric')choices.push({text:'🏘️ Aptarti kaimo būklę',act:()=>{const s=state.flags.villageStatus;modal('Briarford reikalai','Tilto būklė: '+s.bridge+'%. Maisto atsargos: '+s.food+'. Mokesčių įtampa: '+s.taxMood+'/100.',[{text:'Grįžti',act:()=>talk(id)}])}});if(id==='Elna'&&(state.items.parcel||0)>0&&state.quests.parcel?.status==='active')choices.unshift({text:'📦 Perduoti Vessa siuntinį',act:()=>{addItem('parcel',-1);state.quests.parcel.status='done';remember(id,'pristatei siuntinį',8);state.gold+=7;gainXP(9);notify('Elna priėmė siuntinį. +7 monetos, +9 XP.')}});const mem=n.memory[0]?.text;modal(n.name+' · '+n.job,n.desc+' Santykis '+n.relationship+'/100. '+(mem?'Prisimena: '+mem+'.':''),choices)}
function rumor(id){ensureV02();const n=state.npcs.find(z=>z.id===id);const s=state.flags.villageStatus;let pool=[s.bridge<60?'Tilto lentos supuvusios, prekybininkai vengia važiuoti.':'Tilto remontas pagaliau juda į priekį.',s.taxMood>60?'Kaimiečiai nerimauja dėl mokesčių sprendimų.':'Kol kas seniūnas mokesčių nekeičia.',s.food<4?'Miltų atsargos mažėja, smuklėje tai jau pastebėjo.':'Ūkininkai šį mėnesį tikisi neblogo derliaus.',state.flags.tracksFound?'Kažkas rado įtartinų pėdsakų miške.':'Prie miško kelio pastebėta keistų žymių.',state.quests.hunt?.status==='done'?'Renn parnešė mėsos, kaime dabar kiek ramiau.':'Medžiotojai ieško pagalbos miške.',state.flags.interiorVisited.inn?'Smuklėje užsuko nepažįstamas keliautojas.':'Kelio smuklėje vakar vyko ilgi pokalbiai.'];let key=id+':rumor',i=state.flags.talkCycles[key]||0;state.flags.talkCycles[key]=i+1;skillUp('social',1);modal(n?.name||'Kaimo gandai','„'+pool[(i+id.length+state.day)%pool.length]+'“',[{text:'Paklausti dar vieno gando',act:()=>rumor(id)},{text:'Grįžti prie pokalbio',act:()=>talk(id)}])}
function villageDay(){ensureV02();const s=state.flags.villageStatus;const drift=Math.floor(rand(-6,7));s.bridge=Math.max(20,Math.min(100,s.bridge-(s.bridge>60?2:1)));s.food=Math.max(0,Math.min(12,s.food+Math.floor(rand(-2,3))));s.taxMood=Math.max(10,Math.min(95,s.taxMood+drift));s.supply=Math.max(0,Math.min(12,s.supply+Math.floor(rand(-1,2))));state.enemy.wolfAlive=true;const evt=s.food<3?'Miltai senka, smuklė svarsto branginti maistą.':s.bridge<45?'Kaimo tiltas vis prasčiau atlaiko vežimus.':s.taxMood>70?'Seniūno mokesčių planas papiktino kaimiečius.':'Atėjo nauja diena: žmonės grįžta prie darbų, o jų reikalai keičiasi.';state.log.unshift('['+state.day+' d.] '+evt);state.log=state.log.slice(0,30);for(const n of state.npcs)if(n.memory?.length>0&&rand()<.2)n.relationship=Math.max(0,Math.min(100,n.relationship+(n.traits.kind>60?1:-1)));}

   a.worldEvents[id]={id,day:state.day,text:V04_EVENT_LABELS[id],knownBy:[...(V04_WITNESSES[id]||[])],source:'recovered save'};

 Garrick:['A trader brought unfamiliar metal scraps to the forge yesterday.','Teren has been asking to learn a more difficult joint. He is not ready yet.','The farm tools will need new teeth before the next harvest.','I heard hammering long after dusk, but nobody was in my workshop.','The stone near the old watchtower might once have been a quarry.'],
 Haldric:['The granary inventory is due before the next market day.','The council has yet to decide how much grain to hold for winter.','Orven wants additional patrols on the northern road.','The last census counted several empty homes on the outskirts.','A traveling clerk claims the road tax will change next season. No decree has arrived.'],
 Vessa:['A merchant caravan was delayed south of the crossroads.','Salt is getting dearer farther inland.','Travelers from Kikka speak of preparations for the Magic Knights examination.','The road to Hage is busy with young hopefuls this week.','I sold the last blue cloth to a woman I had never seen before.'],
 Mira:['I am collecting rainwater for my clinic; the river is too muddy after storms.','A child recovered from fever yesterday. That was a good day.','Some wild plants smell different after a mana surge.','I need more clean cloth for the next dressing.','An old healer once kept a ledger of herbs in the watchtower.'],
 Orven:['I found tracks on the north road that do not match the local cart wheels.','The night watch heard stones falling near the ruined tower.','A traveler left the inn before sunrise without his luggage.','The next patrol will check the mill and the old ford.','If someone sees a wolf close to the farms, I want a report, not a rumor.'],
 Renn:['The wolves are moving farther uphill after the rains.','A hunter noticed a fallen tree covering the east trail.','I found a quiet place by the river where the fish hide.','Someone has been using our old snares without asking.','There is an abandoned watchtower beyond the hunter trail. We should be careful there.'],
 Liora:['The water near the mill looked cloudy this morning.','I heard two travelers arguing about the Magic Knights examination.','The old tree on the hill survived another storm.','Mother thinks the fields will need more help before harvest.','There are strange carvings on stones near the tower path.'],
 Teren:['I sharpened three axes this morning. Garrick still says I rush.','One day I will show you a proper enchanted blade.','The merchants brought a shield with an unfamiliar crest.','My arms hurt after yesterday’s practice, but I will be back tomorrow.','I heard someone searching the deserted tower for old weapons.'],
 Elna:['The innkeeper saved me fresh bread this morning.','Someone has been leaving small offerings near the roadside shrine.','I have seen fewer trading carts passing the orchard.','The weather has been kinder to our vegetable beds this week.','I remember when guards still used the old watchtower.']
};
function v05eventQuote(id,ev){
 const self={Garrick:{ore:'I finished my iron order. The new tools are finally off the bench.'},Mira:{herbal:'I received the herbs for the clinic. There is no shortage today.'},Elna:{firewood:'I have enough wood for my stove now.',parcel:'Vessa’s parcel reached me safely.'},Orven:{tracks:'I received the forest tracks report. I will compare it with the patrol logs.'},Renn:{hunt:'I have the hunting supplies I needed.'},Vessa:{parcel:'My delivery to Elna was completed without trouble.'},Haldric:{bridge:'The bridge repair is complete. I have struck it from the work ledger.'}};
 if(self[id]?.[ev])return self[id][ev];
 if(ev==='bridge')return V04_BRIDGE_QUOTES[id]||'The eastern bridge has reopened.';
 const general={ore:'Garrick finished his iron order and is back to ordinary tools.',herbal:'The clinic has replenished its medicinal herbs.',firewood:'Elna has enough firewood for now.',tracks:'Orven received a report about unusual animal tracks.',parcel:'Elna received a sealed delivery from Vessa.',hunt:'Renn has enough supplies for his next hunt.'};
 return general[ev]||'I have heard about that event, though I know little more.';
}
function v05worldRumor(id){
 v05prepare();const f=state.flags.v05;const turns=f.rumors[id]||0;f.rumors[id]=turns+1;
 const lines=V05_RUMORS[id]||['A traveling merchant passed the crossroads.','Someone found animal prints by the river.'];
 const events=Object.keys(state.flags.v04.worldEvents||{}).filter(q=>v04known(id,q));
 // An NPC talks about completed jobs once every five rumor requests rather than endlessly.
 if(events.length&&turns%5===4)return v05eventQuote(id,events[Math.floor(turns/5)%events.length]);
 return lines[(turns+state.day+id.length)%lines.length];
}

v04npcEventLine=function(id,topic){
 if(topic==='rumor')return v05worldRumor(id);
 if(topic==='job'&&id==='Haldric'&&v04known(id,'bridge')){
  v05prepare();const i=state.flags.v05.workTalks.Haldric||0;state.flags.v05.workTalks.Haldric=i+1;
  const lines=['The bridge repairs are complete. I have filed the expense report.','Now I am checking grain stocks and tax records. The village is not run on timber alone.','The mill road will need inspecting before winter.','I want the guards to check the watchtower trail, but we have limited hands.'];return lines[i%lines.length];
 }
 return V05_PREV_EVENT_LINE(id,topic);
};
const V05_PREV_TALK=talk;
talk=function(id){V05_PREV_TALK(id);if(!state?.created)return;
 const body=$('modal-body');if(!body||!state.quests.bridge||state.quests.bridge.status!=='done')return;
 for(const b of Array.from(body.querySelectorAll('button')))if(b.textContent.includes('Talk about the repaired bridge'))b.remove();
 btn(body,'📰 Ask about village changes',()=>{
  v05prepare();const events=Object.keys(state.flags.v04.worldEvents||{});
  const choices=events.map(key=>({text:(key==='bridge'?'🌉 ': '🗣️ ')+(V04_EVENT_LABELS[key]||key),act:()=>{
   if(!v04known(id,key))v04learn(id,key);
   if(key==='bridge')v03npcDialogue(id,'bridge');
   else modal(state.npcs.find(n=>n.id===id)?.name||id,'“'+v05eventQuote(id,key)+'”',[{text:'Ask something else',act:()=>talk(id)}]);
  }}));choices.push({text:'Back',act:()=>talk(id)});modal('Village changes · '+id,'Ask about specific events. Villagers only speak about what they have witnessed or heard.',choices);
 });
};const v05brand=document.querySelector('.brand .sub');if(v05brand)v05brand.textContent='v0.5';

const V03_ORIGINAL_INIT=init;
init=function(){V03_ORIGINAL_INIT();v03init();updateHUD()};

init();
if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
